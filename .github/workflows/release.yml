name: Release plugin

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin metadata
        id: meta
        run: |
          PLUGIN_DIR="plugins/supplier-price-control"
          NAME=$(jq -r '.name' "$PLUGIN_DIR/plugin.json")
          VERSION=$(jq -r '.version' "$PLUGIN_DIR/plugin.json")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=${NAME}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Build plugin archive
        run: |
          cd plugins/supplier-price-control
          zip -r "../../${{ steps.meta.outputs.archive }}" . \
            -x "**/.DS_Store" \
            -x "**/__pycache__/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.name }}-v${{ steps.meta.outputs.version }}-${{ github.run_number }}
          name: ${{ steps.meta.outputs.name }} v${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.meta.outputs.archive }}
          generate_release_notes: true
          make_latest: true
